<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP TEAM • Admin</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial;background:#101319;color:#f3f5f8}*{box-sizing:border-box}body{max-width:1000px;margin:0 auto;padding:32px 18px}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:30px}h2{margin:0 0 16px}small,.muted{color:#9aa5b5}main{display:grid;gap:20px;margin-top:28px}.card{background:#1b222d;border:1px solid #313c4a;border-radius:16px;padding:24px}input{background:#0f141b;color:white;border:1px solid #465162;border-radius:9px;padding:12px;min-width:0}button,.btn{background:#e96a32;color:#111;border:0;border-radius:9px;padding:12px 16px;font-weight:750;cursor:pointer;text-decoration:none}button.secondary,.btn.secondary{background:#313d4d;color:#fff}button.danger{background:#602d36;color:#fff}.row+.row{border-top:1px solid #303a47;padding-top:12px;margin-top:12px}.player-info{flex:1;min-width:190px}.player-info strong{display:block}.player-info small{overflow-wrap:anywhere}.actions input{width:170px}#status{min-height:22px;color:#f2bd85}.hidden{display:none!important}@media(max-width:560px){.actions{width:100%}.actions input{flex:1}}
</style><header><div><small>PRIVATE CONTROL PANEL</small><h1>⚡ MP TEAM</h1></div><button class="secondary" id="logout">Log out</button></header><p class="muted">Only the configured Discord account can change the team roster.</p><p id="status" role="status"></p><section id="login" class="card hidden"><h2>Discord authentication</h2><p>Sign in with your authorized Discord account.</p><a class="btn" href="/auth/login">Login with Discord</a></section><main id="panel" class="hidden"><section class="card"><h2>Team settings</h2><form id="prefixForm" class="actions"><label>Nickname prefix <input id="prefix" maxlength="20" required></label><button>Save prefix</button></form></section><section class="card"><h2>Add player</h2><form id="addForm" class="actions"><input id="steamid" placeholder="SteamID64" pattern="[0-9]{17}" required><input id="nickname" placeholder="Nickname" maxlength="64" required><button>Add player</button></form></section><section class="card"><div class="row"><h2>Players (<span id="count">0</span>)</h2><button class="secondary" id="refresh">Refresh</button></div><div id="players"></div></section></main><script>
const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j;}
async function load(){try{const me=await api('/api/admin/me');$('login').classList.toggle('hidden',me.authorized);$('panel').classList.toggle('hidden',!me.authorized);if(!me.authorized)return;const data=await api('/api/admin/players');$('prefix').value=data.prefix;$('count').textContent=data.players.length;const list=$('players');list.replaceChildren();for(const p of data.players){const row=document.createElement('div');row.className='row';const info=document.createElement('div');info.className='player-info';const title=document.createElement('strong');title.textContent=p.nickname;const id=document.createElement('small');id.textContent=p.steamid;info.append(title,id);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='Edit';edit.className='secondary';edit.onclick=async()=>{const name=prompt('New nickname:',p.nickname);if(name===null)return;try{await api('/api/admin/players/'+p.steamid,'PUT',{nickname:name});status('Player updated');await load();}catch(e){status(e.message)}};const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.onclick=async()=>{if(!confirm('Remove '+p.nickname+'?'))return;try{await api('/api/admin/players/'+p.steamid,'DELETE',{});status('Player removed');await load();}catch(e){status(e.message)}};actions.append(edit,del);row.append(info,actions);list.append(row);}}catch(e){status(e.message)}}
$('addForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/players','POST',{steamid:$('steamid').value.trim(),nickname:$('nickname').value.trim()});$('addForm').reset();status('Player added');await load();}catch(err){status(err.message)}};
$('prefixForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/prefix','PUT',{prefix:$('prefix').value});status('Prefix updated');await load();}catch(err){status(err.message)}};
$('refresh').onclick=load;$('logout').onclick=async()=>{await api('/api/admin/logout','POST',{});location.reload()};load();
</script></html>
