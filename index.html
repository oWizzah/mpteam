<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP TEAM • Steam Roster</title><style>
:root{font-family:Inter,system-ui,Arial;color-scheme:dark;background:#101319;color:#f4f5f8}*{box-sizing:border-box}body{max-width:1060px;margin:auto;padding:32px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:38px;margin:5px 0}h2{margin-top:0}.muted{color:#a4aebd}.card{background:#1c232e;border:1px solid #36414f;border-radius:16px;padding:24px;margin:20px 0}button,.btn{display:inline-block;background:#ee7139;border:0;color:#121212;font-weight:750;border-radius:10px;padding:13px 18px;text-decoration:none;cursor:pointer}button.secondary{background:#354154;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.player{background:#121820;border:1px solid #344051;border-radius:10px;padding:14px;overflow-wrap:anywhere}.player small{display:block;color:#9ba6b5;margin-top:6px}.steps{line-height:1.8}#error{color:#ffb8a2}a{color:#ffad81}select{padding:10px;border-radius:8px;background:#252f3e;color:#fff;border:1px solid #465365}
</style><header><div><small class="muted">RUST TEAM MANAGEMENT</small><h1>⚡ MP TEAM</h1></div><select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option></select></header><p id="subtitle" class="muted"></p><div class="card"><h2 id="setupTitle"></h2><ol class="steps"><li id="step1"></li><li id="step2"></li><li id="step3"></li><li id="step4"></li></ol><a id="bookmark" class="btn" href="#"></a><p id="notice" class="muted"></p><p id="error"></p></div><div class="card"><h2 id="rosterTitle"></h2><p class="muted" id="prefix"></p><div id="players" class="grid"></div></div><p class="muted" id="footer"></p><script>
// REQUIRED: replace the URL below with your deployed Cloudflare Worker URL (no trailing slash).
const API_BASE='https://mp-team-api.mpteamup.workers.dev';
const strings={en:{subtitle:'Your live Steam team roster, managed privately through Discord.',setup:'Add the team without installing an extension',steps:['Show your bookmarks bar (Ctrl+Shift+B).','Drag the orange MP TEAM button onto your bookmarks bar.','Open Steam Community in this same browser and sign in.','On Steam Community, click the saved MP TEAM bookmark and confirm.'],button:'⚡ MP TEAM — drag to bookmarks',notice:'The bookmark retrieves the current player list each time. Steam may change or reject its unofficial endpoints.',roster:'Team players',prefix:'Nickname prefix:',footer:'Admin access is available only on the private Worker admin URL.',err:'Unable to load roster. Check the Worker URL and deployment.'},pt:{subtitle:'Lista Steam atualizada em tempo real, gerida de forma privada através do Discord.',setup:'Adicionar a equipa sem instalar extensões',steps:['Mostra a barra de favoritos (Ctrl+Shift+B).','Arrasta o botão laranja MP TEAM para a barra de favoritos.','Abre a Steam Community neste navegador e inicia sessão.','Na Steam Community, clica no favorito MP TEAM e confirma.'],button:'⚡ MP TEAM — arrastar para favoritos',notice:'O favorito obtém sempre a lista atual. A Steam pode alterar ou rejeitar os seus endpoints internos.',roster:'Jogadores da equipa',prefix:'Prefixo das alcunhas:',footer:'O acesso de administrador está disponível apenas no endereço privado do Worker.',err:'Não foi possível carregar a lista. Verifica o endereço e a publicação do Worker.'}};
let roster={players:[],prefix:'MP '};const $=id=>document.getElementById(id);
function render(){const t=strings[$('lang').value];$('subtitle').textContent=t.subtitle;$('setupTitle').textContent=t.setup;for(let i=1;i<=4;i++)$('step'+i).textContent=t.steps[i-1];$('bookmark').textContent=t.button;$('notice').textContent=t.notice;$('rosterTitle').textContent=t.roster;$('prefix').textContent=t.prefix+' '+roster.prefix;$('footer').textContent=t.footer;const list=$('players');list.replaceChildren();for(const p of roster.players){const d=document.createElement('div');d.className='player';const b=document.createElement('b');b.textContent=p.nickname;const s=document.createElement('small');s.textContent=p.steamid;d.append(b,s);list.append(d)};}
// Runs only when user manually clicks the saved bookmark on steamcommunity.com.
// Fetching roster from the API ensures saved bookmarks do not contain stale player lists.
function bookmarkScript(api){return `(async()=>{if(location.hostname!=='steamcommunity.com'){alert('Open https://steamcommunity.com/my/friends/ first.');return;}if(!confirm('MP TEAM: send friend requests and set nicknames for the current team roster?'))return;const api=${JSON.stringify(api)};const pause=ms=>new Promise(r=>setTimeout(r,ms));let data;try{const r=await fetch(api+'/api/public');if(!r.ok)throw Error('Roster HTTP '+r.status);data=await r.json()}catch(e){alert('MP TEAM roster error: '+e.message);return}const sid=typeof g_sessionID!=='undefined'?g_sessionID:null;const own=typeof g_steamID!=='undefined'?String(g_steamID):'';if(!sid){alert('Steam session not found. Sign in and refresh.');return}const box=document.createElement('div');Object.assign(box.style,{position:'fixed',right:'15px',bottom:'15px',zIndex:'2147483647',background:'#1b222d',color:'white',padding:'16px',border:'1px solid #ee7139',borderRadius:'12px',maxWidth:'360px',font:'13px Arial'});const label=document.createElement('div');label.textContent='MP TEAM starting…';const stop=document.createElement('button');stop.textContent='Stop';stop.style.marginTop='10px';let stopped=false;stop.onclick=()=>{stopped=true;label.textContent='Stopping after current player…'};box.append(label,stop);document.body.append(box);let friends=new Set();try{const r=await fetch('/my/friends/',{credentials:'include'});const doc=new DOMParser().parseFromString(await r.text(),'text/html');doc.querySelectorAll('[data-steamid]').forEach(x=>friends.add(x.getAttribute('data-steamid')))}catch(e){console.warn(e)}let i=0;for(const p of data.players){if(stopped)break;i++;if(p.steamid===own)continue;label.textContent=i+'/'+data.players.length+' · '+data.prefix+p.nickname;try{let friendship='already friend';if(!friends.has(p.steamid)){const r=await fetch('/actions/AddFriendAjax',{method:'POST',credentials:'include',body:new URLSearchParams({sessionID:sid,steamid:p.steamid,accept_invite:'0'})});friendship='friend HTTP '+r.status}const r=await fetch('/profiles/'+p.steamid+'/ajaxsetnickname/',{method:'POST',credentials:'include',body:new URLSearchParams({nickname:data.prefix+p.nickname,sessionid:sid})});console.log('[MP TEAM]',p.nickname,friendship,'nickname HTTP '+r.status)}catch(e){console.warn('[MP TEAM]',p.nickname,e)}await pause(3000)}label.textContent=stopped?'MP TEAM stopped':'MP TEAM finished. Check the console for results.'})();`}
function refreshBookmark(){if(API_BASE.includes('REPLACE-WITH'))return;const code=bookmarkScript(API_BASE);$('bookmark').href='javascript:'+encodeURIComponent(code)}
$('lang').value=(navigator.language||'en').toLowerCase().startsWith('pt')?'pt':'en';$('lang').onchange=render;render();refreshBookmark();
(async()=>{try{if(API_BASE.includes('REPLACE-WITH'))throw Error('Configure API_BASE in index.html');const r=await fetch(API_BASE+'/api/public');if(!r.ok)throw Error('HTTP '+r.status);roster=await r.json();render()}catch(e){$('error').textContent=strings[$('lang').value].err+' ('+e.message+')'}})();
</script></html>
