<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0%,#203c53 0%,#101820 55%);color:#e9f3ff;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}.card{width:100%;max-width:690px;background:#1b2838;padding:32px;border:1px solid #34506a;border-radius:18px;box-shadow:0 15px 60px #0006}h1{margin:0 0 12px;color:#66c0f4;font-size:30px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.langs{display:flex;gap:6px;background:#101820;border-radius:10px;padding:4px}.langs button{background:transparent;color:#c8d7e6;border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:700}.langs button.active{background:#66c0f4;color:#10202d}.btn{display:inline-block;background:#66c0f4;color:#10202d;text-decoration:none;font-weight:800;padding:16px 20px;border-radius:10px;cursor:grab;max-width:100%;text-align:center}li{margin:12px 0;line-height:1.55}code{color:#a7e7ff}a:not(.btn){color:#66c0f4}small{color:#b8c8d9;line-height:1.6;display:block}.hint{color:#a7e7ff;font-size:14px}.count{color:#b8c8d9;font-size:14px;margin-top:0}@media(max-width:520px){.card{padding:22px}h1{font-size:25px}}
</style></head><body><main class="card"><div class="top"><div><h1>⚡ MP TEAM — Steam</h1><p class="count">18 Steam players · MP prefix</p></div><div class="langs" aria-label="Language / Idioma"><button type="button" data-lang="pt" aria-pressed="true">🇵🇹 PT</button><button type="button" data-lang="en" aria-pressed="false">🇬🇧 EN</button></div></div>
<p data-i18n="desc"></p><ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li><li data-i18n="step4"></li></ol>
<p><a class="btn" id="bookmarklet" href="#" draggable="true"></a></p><p class="hint" data-i18n="tip"></p><small data-i18n="warning"></small></main><script>

const players = [
["76561197965037572","WaterSoup"],["76561198432746295","Tavares"],["76561198875125145","CX"],["76561197991567353","Blizz4rD"],["76561198011935582","Squeeze"],["76561198415235113","Carlos †"],["76561198423076898","Enjoyer"],["76561198305465574","rato"],["76561198882052331","Scuff"],["76561198351105764","Wosdyo"],["76561198054200991","Neo"],["76561199388028456","FNUF"],["76561198026059762","AgenteBreta"],["76561198340944408","Bern"],["76561199045247233","MannyG"],["76561198116241851","Miller"],["76561199433241739","Wizza"],["76561199143556901","Boonky."],["76561198122476225","Andre"]];
const runner = async function(rows,lang){
const en=lang==="en";const tr=(pt,english)=>en?english:pt;
if(location.hostname!=="steamcommunity.com"){alert(tr("Abre steamcommunity.com/my/friends/ antes de usar o favorito.","Open steamcommunity.com/my/friends/ before using the bookmark."));return;}
if(!confirm(tr("MP TEAM: enviar pedidos de amizade e tentar aplicar alcunhas MP aos ","MP TEAM: send friend requests and try to set MP nicknames for ")+rows.length+tr(" jogadores?"," players?")))return;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const panel=document.createElement("div");panel.style.cssText="position:fixed;right:12px;bottom:12px;z-index:2147483647;background:#171a21;color:white;border:1px solid #66c0f4;padding:14px;max-width:360px;font:13px Arial;border-radius:8px;box-shadow:0 5px 20px #0008";
const status=document.createElement("div");status.textContent=tr("A iniciar…","Starting…");const cancel=document.createElement("button");cancel.textContent=tr("Parar","Stop");cancel.style.cssText="margin-top:8px;padding:6px 14px;cursor:pointer";let stopped=false;cancel.onclick=()=>{stopped=true;status.textContent=tr("A parar…","Stopping…")};panel.append(status,cancel);document.body.append(panel);
try{
const session=typeof window.g_sessionID==="string"?window.g_sessionID:null;
const own=typeof window.g_steamID!=="undefined"?String(window.g_steamID):null;
if(!session)throw Error(tr("Sessão Steam não detetada. Abre /my/friends/ e atualiza a página.","Steam session not detected. Open /my/friends/ and refresh the page."));
const response=await fetch("/my/friends/",{credentials:"include"});if(!response.ok)throw Error(tr("Não foi possível obter a lista de amigos.","Could not retrieve the friends list."));
const doc=new DOMParser().parseFromString(await response.text(),"text/html");const friends=new Set([...doc.querySelectorAll("[data-steamid]")].map(x=>x.getAttribute("data-steamid")));
let done=0;for(const [id,name] of rows){if(stopped)break;if(id===own){done++;continue;}status.textContent=`${done+1}/${rows.length}: MP ${name}`;
try{let friendResult=tr("Já amigo","Already a friend");if(!friends.has(id)){const r=await fetch("/actions/AddFriendAjax",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({sessionID:session,steamid:id,accept_invite:"0"})});friendResult=tr("Pedido HTTP ","Request HTTP ")+r.status;}
const nick=await fetch("/profiles/"+id+"/ajaxsetnickname/",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({nickname:"MP "+name,sessionid:session})});console.log("MP TEAM",id,name,friendResult,tr("Alcunha HTTP","Nickname HTTP"),nick.status);status.textContent=`${done+1}/${rows.length}: MP ${name} · ${friendResult} · alcunha HTTP ${nick.status}`;
}catch(e){console.warn("MP TEAM",id,e);status.textContent=`${done+1}/${rows.length}: erro ${name}`;}done++;await sleep(3000);}
status.textContent=stopped?`${tr("Parado","Stopped")} (${done}/${rows.length})`:`${tr("Concluído","Completed")} (${done}/${rows.length}). ${tr("Consulta a consola para resultados.","Check the console for results.")}`;
}catch(e){status.textContent=tr("Erro: ","Error: ")+e.message;console.error("MP TEAM",e);}
};
function updateBookmarklet(lang){
 const payload="("+runner.toString()+")("+JSON.stringify(players)+","+JSON.stringify(lang)+")";
 document.getElementById("bookmarklet").href="javascript:"+encodeURIComponent(payload);
}
const labels={
 pt:{desc:'Adiciona os membros da equipa e tenta aplicar as alcunhas <strong>MP</strong>, sem instalar extensões.',step1:'No Chrome, mostra a barra de favoritos com <code>Ctrl+Shift+B</code>.',step2:'Arrasta o botão azul <strong>⚡ MP TEAM</strong> para a barra de favoritos (não basta clicar aqui).',step3:'Abre <a href="https://steamcommunity.com/my/friends/" target="_blank" rel="noopener">Steam Community → Amigos</a> e inicia sessão.',step4:'Clica no favorito <strong>⚡ MP TEAM</strong> e confirma a execução.',button:'⚡ MP TEAM — ARRASTA PARA FAVORITOS',warning:'O script só corre quando clicas no favorito dentro de steamcommunity.com. Não partilhes cookies, palavras-passe ou IDs de sessão. Pedidos de amizade e alcunhas usam endpoints internos da Steam e podem falhar ou mudar.',tip:'Escolhe o idioma antes de arrastar o favorito. O idioma do favorito fica guardado quando o adicionas.'},
 en:{desc:'Add your teammates and try to apply <strong>MP</strong> nicknames, without installing extensions.',step1:'In Chrome, show the bookmarks bar with <code>Ctrl+Shift+B</code>.',step2:'Drag the blue <strong>⚡ MP TEAM</strong> button to your bookmarks bar (just clicking here is not enough).',step3:'Open <a href="https://steamcommunity.com/my/friends/" target="_blank" rel="noopener">Steam Community → Friends</a> and sign in.',step4:'Click your <strong>⚡ MP TEAM</strong> bookmark and confirm.',button:'⚡ MP TEAM — DRAG TO BOOKMARKS',warning:'The script runs only when you click the bookmark on steamcommunity.com. Never share cookies, passwords or session IDs. Friend requests and nicknames use unofficial Steam endpoints and may fail or change.',tip:'Choose your language before dragging the bookmark. The bookmark saves the selected language.'}
};
function setLanguage(lang){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=labels[lang][el.dataset.i18n]});document.querySelectorAll('[data-lang]').forEach(btn=>{btn.setAttribute('aria-pressed',String(btn.dataset.lang===lang));btn.classList.toggle('active',btn.dataset.lang===lang)});updateBookmarklet(lang);}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));
setLanguage(navigator.language.toLowerCase().startsWith('pt')?'pt':'en');
</script></body></html>
